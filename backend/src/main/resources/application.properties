
# ========================================================
# APPLICATION
# ========================================================
spring.application.name=backend
server.port=8080

# ========================================================
# ENVIRONMENT VARIABLES
# Load file .env trong thu muc backend/
# ========================================================
spring.config.import=optional:file:.env[.properties]

# ========================================================
# MARIADB DATASOURCE
# ========================================================
spring.datasource.url=jdbc:mariadb://localhost:3306/vector_hotel_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ========================================================
# JPA / HIBERNATE
# ========================================================
# update: tu dong tao/cap nhat bang, dung validate hoac none o production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# ========================================================
# GOOGLE GEMINI EMBEDDING
# API key duoc doc tu file .env
# ========================================================
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Chi su dung Embedding Model, khong su dung Chat Model
spring.ai.model.chat=none
spring.ai.model.embedding.text=google-genai

# Model embedding Gemini
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY
spring.ai.google.genai.embedding.text.dimensions=768

# ========================================================
# VECTOR STORE
# ========================================================
app.vector-store.file-path=data/vector-store-gemini.json

# ========================================================
# CORS - FRONTEND VITE
# ========================================================
app.cors.allowed-origin=http://localhost:5173

# ========================================================
# SWAGGER / OPENAPI
# ========================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ========================================================
# LOGGING
# ========================================================
logging.level.iuh.fit.backend=DEBUG
