spring.application.name=backend
server.port=8080

# ========================================================
# Cau hinh Spring AI voi Google Gemini (dung API key)
# ========================================================
# Doc them bien moi truong tu file backend/.env (neu co) - file nay KHONG duoc commit
spring.config.import=optional:file:.env[.properties]

# API key lay tu bien moi truong GEMINI_API_KEY (dat trong .env hoac bien moi truong he thong)
# Tao key tai: https://aistudio.google.com/apikey
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY}

# Ung dung chi can Embedding Model, khong dung Chat Model
spring.ai.model.chat=none

# Cau hinh Embedding Model Gemini
spring.ai.model.embedding.text=google-genai
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.task-type=SEMANTIC_SIMILARITY
spring.ai.google.genai.embedding.text.dimensions=768

# ========================================================
# Cau hinh Vector Store & Ung dung
# ========================================================
# File JSON luu vector store offline
# (Dung file rieng cho Gemini: vector cua Ollama/nomic-embed-text KHONG dung chung duoc)
app.vector-store.file-path=data/vector-store-gemini.json

# CORS cho phep frontend Vite
app.cors.allowed-origin=http://localhost:5173

# Swagger UI & OpenAPI Docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.iuh.fit.backend=DEBUG
